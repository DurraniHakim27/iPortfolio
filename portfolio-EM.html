<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Internship: Hydrogen Electrolyzer Optimization — Durrani Hakim</title>
  <meta name="description" content="Redirecting to the internship project page about PEM electrolyzer optimization in Karlsruhe, Germany">
  
  <!-- Redirect to portfolio-Internship.html -->
  <meta http-equiv="refresh" content="0; url=portfolio-Internship.html">
  
  <!-- Favicons -->
  <link href="assets/img/icons8-portfolio-16.png" rel="icon">
  <link href="assets/img/icons8-portfolio-64.png" rel="apple-touch-icon">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-charcoal: #2d2d2d;
      --color-slate: #5a5a5a;
      --color-stone: #8b8680;
      --color-snow: #faf9f7;
      --color-warm-white: #f5f3ef;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--color-snow);
      color: var(--color-charcoal);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .redirect-container {
      text-align: center;
      max-width: 500px;
    }
    
    .redirect-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 2rem;
      font-weight: 300;
      margin-bottom: 1rem;
      color: var(--color-charcoal);
    }
    
    .redirect-message {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--color-slate);
      margin-bottom: 2rem;
    }
    
    .redirect-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      background-color: var(--color-charcoal);
      color: var(--color-snow);
      text-decoration: none;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    
    .redirect-link:hover {
      background-color: var(--color-slate);
      transform: translateY(-2px);
    }
    
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--color-stone);
      border-top-color: var(--color-charcoal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  
  <!-- JavaScript fallback redirect -->
  <script>
    window.location.href = 'portfolio-Internship.html';
  </script>
</head>
<body>
  <div class="redirect-container">
    <div class="spinner" aria-hidden="true"></div>
    <h1 class="redirect-title">Page Moved</h1>
    <p class="redirect-message">
      This page has been moved to a new location. You should be redirected automatically. 
      If not, please click the button below.
    </p>
    <a href="portfolio-Internship.html" class="redirect-link">
      Go to Internship Project
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </div>
</body>
</html>
