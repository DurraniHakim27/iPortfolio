<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Redirecting to Final Year Project...</title>
  
  <!-- Redirect to the actual Final Year Project page -->
  <meta http-equiv="refresh" content="0; url=portfolio-MyTenaga.html">
  
  <!-- Favicons -->
  <link href="assets/img/icons8-portfolio-16.png" rel="icon">
  <link href="assets/img/icons8-portfolio-64.png" rel="apple-touch-icon">
  
  <style>
    :root {
      --color-snow: #F6F7F4;
      --color-mist: #93A4BA;
      --color-slate: #5F7087;
      --color-pine: #4E5F57;
      --color-charcoal: #1D2630;
      --color-stone: #D9D5CC;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--color-snow);
      color: var(--color-charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    
    .redirect-container {
      max-width: 500px;
    }
    
    h1 {
      font-family: 'Newsreader', Georgia, serif;
      font-weight: 400;
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--color-charcoal);
    }
    
    p {
      color: var(--color-slate);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    
    .redirect-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--color-pine);
      color: var(--color-snow);
      text-decoration: none;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    
    .redirect-link:hover {
      background: var(--color-charcoal);
      transform: translateY(-2px);
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--color-stone);
      border-top-color: var(--color-pine);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="redirect-container">
    <div class="spinner"></div>
    <h1>Redirecting...</h1>
    <p>You are being redirected to the Final Year Project page (MyTenaga — Smart Energy Monitoring System).</p>
    <a href="portfolio-MyTenaga.html" class="redirect-link">
      <span>Go to Final Year Project</span>
      <span>→</span>
    </a>
    <p style="margin-top: 2rem; font-size: 0.85rem; color: var(--color-mist);">
      If you are not redirected automatically, please click the link above.
    </p>
  </div>
  
  <!-- Fallback JavaScript redirect -->
  <script>
    window.location.href = 'portfolio-MyTenaga.html';
  </script>
</body>
</html>
